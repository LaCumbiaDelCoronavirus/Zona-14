# Zona14: added displayWeight so the rank will be from highest to lowest
- type: job
  id: StalkerDolg
  displayWeight: 1
  name: job-dolg
  icon: Dolg
  description: job-dolg-desc
  playTimeTracker: JobDolg
  whitelisted: true
  requirements:
    # - !type:RoleTimeRequirement
    #   role: JobDolg
    #   time: 1
    - !type:SpeciesRequirement
      species:
      - Human
      - Dwarf
  startingGear: DolgGear
  supervisors: job-dolg-supervisor
  canBeAntag: false
  special:
    - !type:AddComponentSpecial
      components:
        - type: NpcFactionMember
          factions:
          - Duty
        - type: Access
          tags:
            - Dolg
        - type: Bands
          band: Stalker
          bandIcon: Dolg
          bandProto: STDolgBand
          bandRankId: 2
        - type: BlockTackingHolyItems
        - type: BlockArtifactUsage # Zona14: Duty artifact ban (lore) — holds regardless of worn suit
        - type: TeethPull
          teethProto: ToothStalker
          pullingItemTag: PliersStalker
          teethCount: 3
          initialTeeth: 3
        - type: Vocal # stalker EN change start
          sounds:
            Male: MaleHumanDuty
            Female: FemaleHumanDuty
            Unsexed: MaleHumanDuty # stalker EN change end

