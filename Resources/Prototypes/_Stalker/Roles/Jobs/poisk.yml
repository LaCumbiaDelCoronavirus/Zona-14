# Zona14: Disable StalkerPoisk from job selection menu
- type: job
  id: StalkerPoisk
  setPreference: false
  name: job-poisk
  icon: poisk
  description: job-poisk-desc
  playTimeTracker: JobPoisk
  whitelisted: true
  requirements:
    # - !type:RoleTimeRequirement
    #   role: JobPoisk
    #   time: 1
    - !type:SpeciesRequirement
      species:
      - Human
      - Dwarf
  startingGear: PoiskGear
  supervisors: job-poisk-supervisor
  canBeAntag: false
  special:
    - !type:AddComponentSpecial
      components:
        - type: Access
          tags:
            - Poisk
            - Stalker
        - type: Bands
          band: Stalker
          bandIcon: poisk
        - type: BlockTackingHolyItems
        - type: TeethPull
          teethProto: ToothStalker
          pullingItemTag: PliersStalker
          teethCount: 3
          initialTeeth: 3

- type: startingGear
  id: PoiskGear
  equipment:
    id: StalkerPDA
    torso: ClothingTorsoSweaterStalkerGreen
    legs: ClothingLegsJeansBlue
    shoes: STClothingShoesBootsCombatFilled

