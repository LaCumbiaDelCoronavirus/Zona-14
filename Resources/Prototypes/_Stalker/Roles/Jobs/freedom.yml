# Zona14: added displayWeight so the rank will be from highest to lowest
- type: job
  id: StalkerFreedom
  displayWeight: 2
  name: job-freedom
  icon: freedom
  description: job-freedom-desc
  playTimeTracker: JobFreedom
  whitelisted: true
  requirements:
    # - !type:RoleTimeRequirement
    #   role: JobFreedom
    #   time: 1
    - !type:SpeciesRequirement
      species:
      - Human
      - Dwarf
  startingGear: FreedomGear
  supervisors: job-freedom-supervisor
  canBeAntag: false
  special:
    - !type:AddComponentSpecial
      components:
        - type: NpcFactionMember
          factions:
          - BandsUnion
          - Freedom
        - type: FactionArtifactSlots
          slots: 5 # Zona14: Freedom faction artifact slots
        - type: Access
          tags:
            - Freedom
        - type: Bands
          band: Stalker
          bandIcon: freedom
          bandProto: STFreedomBand
          bandRankId: 2
        - type: BlockTackingHolyItems
        - type: TeethPull
          teethProto: ToothStalker
          pullingItemTag: PliersStalker
          teethCount: 3
          initialTeeth: 3
        - type: Vocal # stalker EN change start
          sounds:
            Male: MaleHumanFreedom
            Female: FemaleHumanFreedom
            Unsexed: MaleHumanFreedom # stalker EN change end

