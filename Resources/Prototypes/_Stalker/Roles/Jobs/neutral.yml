# Zona14: Disable StalkerNeutral from job selection menu
- type: job
  id: StalkerNeutral
  setPreference: false
  name: job-neutral-stalker
  icon: ne
  description: job-neutral-stalker-desc
  playTimeTracker: JobNeutral
  whitelisted: true
  requirements:
    # - !type:RoleTimeRequirement
    #   role: JobNeutral
    #   time: 1
    - !type:SpeciesRequirement
      species:
      - Human
      - Dwarf
  startingGear: NeutralGear
  supervisors: job-neutral-stalker-supervisor
  canBeAntag: false
  special:
    - !type:AddComponentSpecial
      components:
        - type: Access
          tags:
            - Neutral
            - Stalker
        - type: Bands
          band: Stalker
          bandIcon: ne
        - type: BlockTackingHolyItems
        - type: TeethPull
          teethProto: ToothStalker
          pullingItemTag: PliersStalker
          teethCount: 3
          initialTeeth: 3
        - type: Vocal # stalker EN change start
          sounds:
            Male: MaleHumanLoner
            Female: FemaleHumanLoner
            Unsexed: MaleHumanLoner # stalker EN change end

- type: startingGear
